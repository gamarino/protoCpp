name: ci

# Build-and-smoke CI. Compiles protoCore, then protoCpp (all examples and
# every benchmark binary, warnings as errors), and runs every program once
# through ctest, which compares what it prints with tests/expected/. The
# timed benchmark suite is not run here — GitHub-hosted runners share CPU with
# other tenants, so wall-clock numbers from CI would be misleading
# and the published RESULTS.md numbers stay tied to the Ryzen 5 5500U
# laptop they were measured on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # protoCore is pinned so a protoCpp run is reproducible; the same commit is
  # used by cross-platform.yml. Bump both together (README.md, "Continuous
  # integration"). This is protoCore 2.9.4 (tag v2.9.4). protoCpp declares no
  # minimum protoCore version, so there is no floor job.
  PROTOCORE_REF: 9cb0ef540826ee6c3162998db84ddf48464d6e2a

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protoCpp
        uses: actions/checkout@v4
        with:
          path: protoCpp

      - name: Checkout protoCore
        uses: actions/checkout@v4
        with:
          repository: numaes/protoCore
          ref: ${{ env.PROTOCORE_REF }}
          path: protoCore

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ ninja-build

      - name: Build protoCore
        working-directory: protoCore
        run: |
          cmake -B build_release -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build_release --target protoCore

      - name: Build protoCpp
        working-directory: protoCpp
        run: |
          cmake -B build_release -S . -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build_release
          # The programs must load the protoCore just built, not a system copy.
          ldd build_release/example_01_hello | grep -F "$GITHUB_WORKSPACE/protoCore/build_release/libprotoCore.so"

      - name: Smoke — every program prints its expected result
        working-directory: protoCpp
        run: ctest --test-dir build_release --output-on-failure
