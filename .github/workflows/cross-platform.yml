name: cross-platform

# The smoke test of ci.yml (ctest runs every example and benchmark once and
# compares what it prints with tests/expected/) on macOS and Windows, against
# an INSTALLED protoCore package (-DCMAKE_PREFIX_PATH), the mode Windows
# supports.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # protoCore is pinned so a protoCpp run is reproducible; ci.yml uses the
  # same commit. Bump both together (README.md, "Continuous integration").
  # This is the protoCore 2.9.0 master commit (no v2.9.0 tag); its Windows DLL
  # is protoCore-3.dll.
  PROTOCORE_REF: 21889c911b0d0c69bb99d53ea8c3b1bb349f547d

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple clang, arm64)
            os: macos-14
          - name: Windows (MSVC, x64)
            os: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: protoCpp

      - uses: actions/checkout@v4
        with:
          repository: numaes/protoCore
          ref: ${{ env.PROTOCORE_REF }}
          path: protoCore

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and install protoCore
        run: |
          cmake -S protoCore -B protoCore/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build protoCore/build --parallel 4
          cmake --install protoCore/build --prefix "$GITHUB_WORKSPACE/prefix"

      - name: Build protoCpp
        working-directory: protoCpp
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/prefix" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build

      # No protoCore directory on PATH: on Windows the programs must run with
      # the DLL the build copied next to them (named by the imported target).
      - name: Smoke — every program prints its expected result
        working-directory: protoCpp
        run: ctest --test-dir build --output-on-failure

      - name: Installed programs run from a clean directory (Windows)
        if: runner.os == 'Windows'
        working-directory: protoCpp
        run: |
          set -e
          dest=$(cygpath -u "$RUNNER_TEMP")/protocpp
          cmake --install build --prefix "$dest"
          ls "$dest/bin"
          cd "$dest"
          # System directories only: nothing from the build tree or the
          # protoCore prefix.
          out=$(PATH="/c/Windows/system32:/c/Windows" "$dest/bin/example_01_hello.exe")
          echo "$out"
          [ "$out" = "$(cat "$GITHUB_WORKSPACE/protoCpp/tests/expected/example_01_hello.out")" ]
